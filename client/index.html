<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Artisan weed Shop</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>" />
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased pb-28">

  <!-- App Splash / Preloader Overlay -->
  <div id="app-splash-screen" class="fixed inset-0 z-50 bg-stone-900 flex flex-col items-center justify-center transition-all duration-500 ease-out select-none">
    <div class="relative flex items-center justify-center">
      <!-- Glow Ring Animation -->
      <div class="absolute w-24 h-24 rounded-full bg-amber-600/20 animate-ping opacity-75"></div>
      <div class="w-20 h-20 rounded-3xl bg-stone-800/90 border border-stone-700/80 shadow-2xl flex items-center justify-center text-3xl transform transition-transform animate-bounce duration-1000">
        🍵
      </div>
    </div>
    
    <div class="mt-6 text-center space-y-2">
      <h2 class="text-sm font-bold tracking-wider uppercase text-stone-100 font-eng">Artisan Tea</h2>
      <div class="flex items-center justify-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
        <p id="splash-status-text" class="text-xs text-stone-400 font-medium font-sans">กำลังเชื่อมต่อ LINE...</p>
      </div>
    </div>

    <!-- Mini Progress Line -->
    <div class="w-36 h-1 bg-stone-800 rounded-full mt-6 overflow-hidden">
      <div id="splash-progress-bar" class="h-full bg-amber-600 rounded-full w-1/4 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-stone-900 text-stone-100 px-4 py-3 shadow-md flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold tracking-wide">Weed shop</h1>
      <p class="text-xs text-stone-400">คัดสรรกัญชาและอุปกรณ์</p>
    </div>
    <div id="user-badge" class="text-xs bg-stone-800 border border-stone-700 rounded-full px-3 py-1 text-stone-300">
      กำลังเชื่อมต่อ LINE...
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-6">
    <!-- 1. ส่วนแบนเนอร์โปรโมชั่น (Carousel Section) -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold uppercase tracking-wider text-stone-500">โปรโมชั่นพิเศษ</h2>
        <span class="text-xs text-stone-400">ปัดเพื่อดูเพิ่ม ➔</span>
      </div>
      <!-- Scroll Container สำหรับการ์ดแนวนอน -->
      <div id="promotions-slider" class="flex gap-4 overflow-x-auto no-scrollbar snap-x snap-mandatory py-1">
        <!-- Skeleton Loader ระหว่างรอ Fetch -->
        <div class="min-w-[280px] h-36 bg-stone-200 rounded-2xl animate-pulse snap-center"></div>
      </div>
    </section>

    <!-- 2. หมวดหมู่สินค้า (Category Tabs) -->
    <section>
      <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="category-tabs">
      </div>
    </section>

    <!-- 3. แคตตาล็อกรายการสินค้า (Product Grid) -->
    <section>
      <h2 class="text-sm font-bold uppercase tracking-wider text-stone-500 mb-3">รายการสินค้า</h2>
      <div id="product-list" class="space-y-4">
        <!-- Skeleton Loaders -->
        <div class="h-28 bg-stone-200 rounded-2xl animate-pulse"></div>
        <div class="h-28 bg-stone-200 rounded-2xl animate-pulse"></div>
      </div>
    </section>
  </main>

  <!-- 4. แถบสรุปตะกร้าลอยด้านล่าง (Bottom Floating Cart Bar) -->
  <aside id="floating-cart-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-stone-900 text-white rounded-2xl p-4 shadow-xl flex items-center justify-between hidden z-40 transition-all duration-300">
    <div class="flex items-center gap-3">
      <div class="relative">
        <span class="text-2xl">🍵</span>
        <span id="cart-item-count" class="absolute -top-1 -right-2 bg-amber-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
      </div>
      <div>
        <p class="text-xs text-stone-400">ยอดรวมประเมิน</p>
        <p id="cart-total-price" class="text-base font-bold">฿0.00</p>
      </div>
    </div>
    <button id="btn-open-checkout" class="bg-amber-600 hover:bg-amber-500 text-white font-medium text-sm px-5 py-2 rounded-xl shadow-md transition-colors">
      ดูตะกร้า / สั่งซื้อ
    </button>
  </aside>

  <!-- Modal ดูรายละเอียดโปรโมชั่น -->
  <dialog id="promo-modal" class="rounded-2xl p-0 backdrop:bg-stone-900/60 max-w-sm w-full mx-auto shadow-2xl">
    <div class="bg-white p-5 rounded-2xl space-y-3">
      <div class="relative w-full h-40 rounded-xl overflow-hidden bg-stone-100">
        <img id="modal-promo-img" src="" alt="" class="w-full h-full object-cover" />
      </div>
      <h3 id="modal-promo-title" class="text-base font-bold text-stone-900"></h3>
      <p id="modal-promo-desc" class="text-xs text-stone-600 leading-relaxed"></p>
      <div class="bg-stone-50 border border-stone-200 rounded-xl p-3 flex justify-between items-center">
        <div>
          <span class="text-[10px] text-stone-400 block uppercase tracking-wider">รหัสโค้ด</span>
          <span id="modal-promo-code" class="text-sm font-mono font-bold text-amber-700"></span>
        </div>
        <button id="btn-copy-code" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-700 px-3 py-1.5 rounded-lg font-medium">คัดลอก</button>
      </div>
      <button id="btn-close-modal" class="w-full py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-semibold">ปิดหน้าต่าง</button>
    </div>
  </dialog>

  <!-- Modal: ดูรายละเอียดสินค้าเต็มจอ -->
  <dialog id="product-detail-modal" class="w-full h-full max-w-none max-h-none m-0 p-0 bg-transparent backdrop:bg-stone-900/80">
    <div class="min-h-screen bg-stone-50 flex flex-col justify-between max-w-md mx-auto">
      <!-- ภาพสินค้าขนาดใหญ่ & ปุ่มปิด -->
      <div class="relative w-full h-72 bg-stone-100 shrink-0">
        <img id="detail-prod-img" src="" alt="" class="w-full h-full object-cover" />
        <button type="button" id="btn-close-detail-modal" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-stone-900/60 backdrop-blur-md text-white flex items-center justify-center text-lg font-bold">
          &times;
        </button>
        <span id="detail-prod-badge" class="absolute bottom-3 left-4 text-xs font-bold px-2.5 py-1 rounded-lg backdrop-blur-md bg-stone-900/70 text-white"></span>
      </div>

      <!-- รายละเอียดสินค้า -->
      <div class="flex-1 p-5 space-y-4 overflow-y-auto">
        <div>
          <h2 id="detail-prod-name" class="text-xl font-bold text-stone-900"></h2>
          <p id="detail-prod-price" class="text-base font-mono font-bold text-amber-700 mt-1"></p>
        </div>

        <div class="border-t border-stone-200/60 pt-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-stone-400 mb-1">รายละเอียดสินค้า</h3>
          <p id="detail-prod-desc" class="text-xs text-stone-600 leading-relaxed whitespace-pre-line"></p>
        </div>

        <!-- พื้นที่เลือกขนาด/ตัวเลือกใน Modal -->
        <div id="detail-action-area" class="border-t border-stone-200/60 pt-3"></div>
      </div>
    </div>
  </dialog>

  <!-- Script Modules -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
